[package]
name = "perf-test-module"
version = "0.1.0"
edition.workspace = true
license-file = "LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
# `unstable` enables the multi-range ("skip scan") `filter(..)` overload used by the
# spatial-grid benchmark reducers below.
spacetimedb = { path = "../../crates/bindings", features = ["unstable"] }
log.workspace = true
